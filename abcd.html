<!DOCTYPE html>

<html lang="zh-CN">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>下载</title>

    <script src="./public/config.js"></script>

    <!-- 版本号：v2 -->

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            min-height: 100vh;

            padding: 20px;

        }



        .container {

            max-width: 600px;

            margin: 0 auto;

        }



        /* 返回按钮 */

        .back-btn {

            display: inline-block;

            padding: 8px 16px;

            background: rgba(255, 255, 255, 0.2);

            color: white;

            border-radius: 20px;

            cursor: pointer;

            font-size: 14px;

            margin-bottom: 15px;

            transition: all 0.3s;

        }



        .back-btn:hover {

            background: rgba(255, 255, 255, 0.3);

            transform: translateX(-3px);

        }



        h1 {

            text-align: center;

            color: white;

            font-size: 24px;

            margin-bottom: 20px;

            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);

        }



        /* 推荐卡片 */

        .recommend-card {

            background: white;

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);

        }



        .recommend-title {

            font-size: 16px;

            font-weight: 600;

            color: #333;

            margin-bottom: 15px;

            line-height: 1.5;

        }



        .goods-card {

            display: flex;

            gap: 15px;

            padding: 15px;

            background: #f9f9f9;

            border-radius: 12px;

        }



        .goods-img {

            width: 120px;

            height: 120px;

            object-fit: cover;

            border-radius: 8px;

            flex-shrink: 0;

        }



        .goods-info {

            flex: 1;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

        }



        .goods-title {

            font-size: 14px;

            color: #333;

            line-height: 1.4;

            margin-bottom: 8px;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;

        }



        .goods-price {

            font-size: 20px;

            color: #ff4d4f;

            font-weight: 600;

            margin-bottom: 10px;

        }



        .goods-category {

            font-size: 12px;

            color: #999;

            margin-bottom: 10px;

        }



        .goods-actions {

            display: flex;

            gap: 10px;

        }



        .btn-copy {

            padding: 8px 16px;

            background: linear-gradient(135deg, #ff6b6b 0%, #ff4d4f 100%);

            color: white;

            border: none;

            border-radius: 20px;

            font-size: 13px;

            cursor: pointer;

            transition: all 0.3s;

        }



        .btn-copy:hover {

            transform: translateY(-2px);

            box-shadow: 0 4px 12px rgba(255, 77, 79, 0.3);

        }



        .btn-buy {

            padding: 8px 16px;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            color: white;

            text-decoration: none;

            border-radius: 20px;

            font-size: 13px;

            transition: all 0.3s;

        }



        .btn-buy:hover {

            transform: translateY(-2px);

            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);

        }



        /* 下载按钮 */

        .download-card {

            background: white;

            border-radius: 16px;

            padding: 30px;

            margin-bottom: 20px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);

            text-align: center;

        }



        .download-btn {

            display: inline-block;

            padding: 15px 40px;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-size: 16px;

            font-weight: 500;

            transition: all 0.3s;

            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);

        }



        .download-btn:hover {

            transform: translateY(-3px);

            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);

        }



        /* 友情链接 */

        .links-card {

            background: white;

            border-radius: 16px;

            padding: 20px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);

        }



        .links-title {

            font-size: 16px;

            font-weight: 600;

            color: #333;

            margin-bottom: 15px;

            text-align: center;

        }



        .links-list {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            justify-content: center;

        }



        .link-item {

            padding: 8px 16px;

            background: #f5f5f5;

            border-radius: 20px;

            text-decoration: none;

            color: #666;

            font-size: 13px;

            transition: all 0.3s;

        }



        .link-item:hover {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            color: white;

        }



        /* 加载提示 */

        .loading {

            text-align: center;

            padding: 40px;

            color: #999;

        }



        /* 响应式 */

        @media (max-width: 768px) {

            .goods-card {

                flex-direction: column;

            }



            .goods-img {

                width: 100%;

                height: 200px;

            }

        }

    </style>

</head>



<body>

    <div class="container">

        <a href="index.html" class="back-btn">← 返回主页</a>

        <h1>网盘资源搜索</h1>



        <!-- 推荐区域 -->

        <div class="recommend-card">

            <div class="recommend-title">🎁 为你推荐</div>

            <div id="goodsContainer">

                <div class="loading">加载中...</div>

            </div>

        </div>



        <!-- 下载按钮 -->

        <div class="download-card">

            <a id="downloadLink" href="#" target="_blank" class="download-btn">

                📥 点击前往下载

            </a>

        </div>



        <!-- 友情链接 -->

        <div class="links-card">

            <div class="links-title">🔗 友情链接</div>

            <div class="links-list">

                <a href="https://feihong64800.github.io/so" target="_blank" class="link-item">备用网址</a>

                <a href="https://www.yulinlin.cn" target="_blank" class="link-item">淘宝精选</a>

                <a href="https://books.yulinlin.cn" target="_blank" class="link-item">电子书在线阅读</a>

                <a href="https://me.yulinlin.cn" target="_blank" class="link-item">网址发布</a>

                <a href="https://shop260623877.taobao.com" target="_blank" class="link-item">淘宝让店铺</a>

                

                <a href="https://feihong64800.github.io" target="_blank" class="link-item">淘宝精选备用</a>

                <a href="https://feihong64800.github.io/books" target="_blank" class="link-item">电子书在线阅读备用</a>

                <a href="https://feihong64800.github.io/me" target="_blank" class="link-item">me.yulinlin.cn备用</a>

               





            </div>

        </div>

    </div>



    <script>

        // 加载推荐

        async function loadRecommend() {

            console.log('开始加载推荐...');

            try {

                const kw = localStorage.getItem('searchKeyword') || '';
                const response = await fetch(CONFIG.BASE_URL+'/searchapi/ad.php', {
                    method: 'POST',
                    body: new URLSearchParams({ q: kw })
                });
                console.log('响应状态:', response.status);
                const result = await response.json();
                console.log('推荐数据:', result, '命中方式:', result.match);



                if (result.success && result.data) {

                    const item = result.data;

                    document.getElementById('goodsContainer').innerHTML = `

                        <div class="goods-card">

                            <img class="goods-img" src="${item.img || 'https://via.placeholder.com/120'}" alt="${item.title}">

                            <div class="goods-info">

                                <div class="goods-title">${item.title}</div>

                                <div class="goods-price">${item.price}</div>

                                <div class="goods-category">${item.category || '其它'}</div>

                                <div class="goods-actions">

                                    <button class="btn-copy" onclick="copyTkl('${item.taokouling || ''}')">复制口令</button>

                                    <a class="btn-buy" href="${item.short_link || '#'}" target="_blank">去购买</a>

                                </div>

                            </div>

                        </div>

                    `;

                }

            } catch (error) {

                console.error('加载推荐失败:', error);

            }

        }



        // 复制口令

        function copyTkl(text) {

            if (!text) {

                alert('暂无口令');

                return;

            }



            navigator.clipboard.writeText(text).then(() => {

                alert('口令已复制，打开淘宝即可购买');

            }).catch(() => {

                // 兼容旧浏览器

                const textarea = document.createElement('textarea');

                textarea.value = text;

                document.body.appendChild(textarea);

                textarea.select();

                document.execCommand('copy');

                document.body.removeChild(textarea);

                alert('口令已复制，打开淘宝即可购买');

            });

        }



        // 设置下载链接

        const downloadUrl = localStorage.getItem('downloadUrl');

        if (downloadUrl) {

            document.getElementById('downloadLink').href = decodeURIComponent(downloadUrl);

        } else {

            document.getElementById('downloadLink').style.display = 'none';

        }



        // 页面加载时获取推荐

        loadRecommend();

    </script>

</body>



</html>
